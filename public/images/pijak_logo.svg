<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Primary Pijak Blue Gradient -->
    <linearGradient id="pijakBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#1570ef"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="pijakCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Indigo Step Gradient -->
    <linearGradient id="pijakIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle Card -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#334155" stroke-width="3" opacity="0.6"/>

  <!-- Subtle Background Grid/Tech Lines -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="2">
    <line x1="80" y1="120" x2="432" y2="120"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="392" x2="432" y2="392"/>
    <line x1="150" y1="80" x2="150" y2="432"/>
    <line x1="280" y1="80" x2="280" y2="432"/>
    <line x1="390" y1="80" x2="390" y2="432"/>
  </g>

  <!-- Stepping Stones / P Monogram Symbol -->
  <!-- Stem of the P (Upward Stepping Blocks) -->
  <!-- Step 1: Bottom foundation block -->
  <rect x="136" y="324" width="76" height="84" rx="20" fill="url(#pijakIndigo)"/>
  
  <!-- Step 2: Middle rising block -->
  <rect x="136" y="214" width="76" height="96" rx="20" fill="url(#pijakBlue)"/>
  
  <!-- Step 3: Top anchor block -->
  <rect x="136" y="104" width="76" height="96" rx="20" fill="url(#pijakCyan)"/>

  <!-- Loop of the 'P' (Ascending Loop & Forward Arrow Springboard) -->
  <path d="M 176 104 L 290 104 C 362 104 404 146 404 214 C 404 282 362 324 290 324 L 230 324 C 218 324 212 316 212 304 L 212 254 C 212 242 218 236 230 236 L 284 236 C 314 236 332 222 332 214 C 332 206 314 192 284 192 L 176 192 Z" fill="url(#pijakBlue)" filter="url(#glow)"/>

  <!-- Inner Dynamic Spark (AI Core / Rising Trajectory) -->
  <polygon points="268,148 296,148 276,182 308,182 254,232 268,194 246,194" fill="#ffffff" opacity="0.95"/>

  <!-- Small AI Node Dots -->
  <circle cx="364" cy="148" r="8" fill="#38bdf8"/>
  <circle cx="414" cy="214" r="10" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="364" cy="280" r="8" fill="#818cf8"/>
  <line x1="364" y1="148" x2="414" y2="214" stroke="#38bdf8" stroke-width="3" opacity="0.5"/>
  <line x1="414" y1="214" x2="364" y2="280" stroke="#818cf8" stroke-width="3" opacity="0.5"/>
</svg>